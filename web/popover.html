<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Pause</title>
<style>
:root {
  --bg: #141416; --tile: #1e1e21; --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.14);
  --text: #e8e8ea; --muted: #8e8e93; --muted-2: #b0b0b5;
  --blue: #4cc2ff; --orange: #ffb340; --green: #7ee29a; --frozen: #8ad6ff; --dim: #7a6a55;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); }
/* The popover is sized to the content; never show scroll bars (it can still scroll if the screen is too small). */
html { overflow-x: hidden; }
::-webkit-scrollbar { display: none; }
body {
  color: var(--text); font: 12px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; cursor: default;
  width: 100%; padding: 12px; display: flex; flex-direction: column; gap: 10px;
}
.mono { font-family: var(--mono); }
.cap { font-size: 10px; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
button { font: inherit; cursor: default; }
.btn {
  border: 1px solid var(--line-2); background: #26262a; color: var(--text);
  font-size: 11px; padding: 4px 0; border-radius: 6px; flex: 1;
}
.btn:hover { background: #2e2e33; }
.btn.on { background: #173a52; border-color: #2f6f99; color: #8ad6ff; font-weight: 600; }
.btn.go { background: #1f4d2b; border-color: #2f7a43; color: var(--green); font-weight: 600; font-size: 12px; padding: 5px; }
.btn.go:hover { background: #255c33; }
.btn.small { flex: none; padding: 3px 8px; }

.head { display: flex; align-items: center; gap: 8px; }
.badge { font-size: 10px; letter-spacing: .06em; font-weight: 700; padding: 2px 6px; border-radius: 4px; color: var(--bg); background: #3a3a3f; }
.badge.paused { background: var(--orange); }
.badge.running { background: #2f7a43; color: #d9f7e1; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--tile); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
.icon.paused { background: var(--orange); color: var(--bg); }
.icon.running { background: #1f4d2b; color: var(--green); }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toggle { width: 28px; height: 16px; border-radius: 99px; background: #48484a; position: relative; border: 0; padding: 0; flex: none; }
.toggle::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle.on { background: #30d158; }
.toggle.on::after { transform: translateX(12px); }
.row { display: flex; gap: 4px; }
.col { display: flex; flex-direction: column; gap: 4px; }

svg { display: block; }
.b { fill: var(--blue); } .b.p { fill: var(--dim); } .b.w { fill: var(--orange); }
.band { fill: rgba(255,179,64,.12); }

.table-head, .tr { display: grid; grid-template-columns: minmax(0, 1fr) 70px 92px 38px; gap: 0 8px; align-items: center; }
.table-head { padding: 0 4px; margin-top: 2px; }
.tr { padding: 6px 4px; border-top: 1px solid rgba(255,255,255,.06); border-radius: 6px; }
.tr:hover { background: rgba(255,255,255,.04); }
.state { font-size: 10px; font-weight: 600; }
.now { text-align: right; font-family: var(--mono); font-weight: 600; }
.detail { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; padding: 8px 0 2px; }
.procs { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 2px 8px; font-family: var(--mono); font-size: 10px; color: var(--muted-2); }
.procs span:nth-child(odd) { text-align: right; color: var(--text); }
.empty { color: var(--muted); padding: 14px 4px; text-align: center; border-top: 1px solid rgba(255,255,255,.06); }
.foot { display: flex; gap: 6px; border-top: 1px solid rgba(255,255,255,.08); padding-top: 10px; }
</style>
</head>
<body>
<div class="head">
  <span class="cap" style="letter-spacing: .12em">AI PAUSE</span>
  <span class="badge" id="badge">…</span>
  <span style="flex: 1"></span>
  <span class="mono" style="font-size: 11px; color: var(--muted)" id="since"></span>
</div>

<div class="tiles">
  <div class="tile">
    <div style="display: flex; align-items: center; gap: 8px">
      <div class="icon" id="stateIcon"></div>
      <div style="min-width: 0">
        <div style="font-weight: 600; font-size: 13px" id="stateTitle"></div>
        <div style="font-size: 11px; color: var(--muted-2)" class="ellipsis" id="stateSub"></div>
      </div>
    </div>
    <button class="btn go" id="resume" data-click="resume">Resume</button>
    <div class="col" id="pauseNow">
      <span class="cap">PAUSE FOR</span>
      <div class="row">
        <button class="btn" data-click="pause:15m">15m</button><button class="btn" data-click="pause:1h">1h</button>
        <button class="btn" data-click="pause:2h">2h</button><button class="btn" data-click="pause:0" aria-label="Until resumed">∞</button>
      </div>
    </div>
  </div>

  <div class="tile">
    <div style="display: flex; align-items: baseline">
      <span class="cap">ALL AGENTS</span>
      <span style="flex: 1"></span>
      <span class="mono" style="font-size: 15px; font-weight: 600" id="totalNow">–</span>
    </div>
    <div id="totalChart"></div>
    <div class="mono" style="font-size: 10px; color: var(--muted)">avg <b style="color: var(--text)" id="totalAvg">–</b> · peak <b style="color: var(--text)" id="totalPeak">–</b></div>
  </div>

  <div class="tile">
    <span class="cap">MODE</span>
    <div class="col" id="modes">
      <button class="btn" data-click="mode:polite">Polite</button>
      <button class="btn" data-click="mode:throttle">Throttle</button>
      <button class="btn" data-click="mode:freeze">Freeze</button>
    </div>
  </div>

  <div class="tile">
    <div style="display: flex; align-items: center">
      <span class="cap">AUTO-PAUSE</span>
      <span style="flex: 1"></span>
      <button class="toggle" id="autoToggle" data-click="auto" aria-label="Auto-pause"></button>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500" id="autoState"></div>
    <div style="font-size: 11px; color: var(--muted)" id="autoSub"></div>
  </div>
</div>

<div class="table-head cap"><span>SESSION</span><span>STATE</span><span>2 MIN</span><span style="text-align: right">NOW</span></div>
<div id="sessions" style="margin-top: -6px"></div>

<div class="foot">
  <button class="btn" data-click="dashboard">Settings…</button>
  <button class="btn" data-click="quit">Quit AI Pause</button>
</div>

<script>
"use strict";
const N = 40;
const MODES = { polite: "Polite", throttle: "Throttle", freeze: "Freeze" };
const STATE_COLORS = { "STILL BUSY": "var(--orange)", "BACKED OFF": "var(--green)", FROZEN: "var(--frozen)", BUSY: "var(--text)", IDLE: "var(--muted)" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const pct = (v) => `${Math.round(v)}%`;
const post = (msg) => window.webkit?.messageHandlers?.aipause?.postMessage(JSON.stringify(msg));
const time = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const PAUSE_ICON = `<svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><rect x="3" y="2" width="2.6" height="10" rx="1" fill="currentColor"/><rect x="8.4" y="2" width="2.6" height="10" rx="1" fill="currentColor"/></svg>`;
const PLAY_ICON = `<svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M4 2.5v9l7.5-4.5z" fill="currentColor"/></svg>`;
const VIDEO_ICON = `<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" style="flex:none"><path d="M2 5h8v6H2Z M10 7l4-2v6l-4-2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

let open = new Set();

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-click]");
  if (el) { post({ action: "click", id: el.dataset.click }); return; }
  const tr = e.target.closest("[data-pid]");
  if (tr) {
    const pid = +tr.dataset.pid;
    // Only one session expanded at a time keeps the popover compact.
    open = open.has(pid) ? new Set() : new Set([pid]);
    render();
  }
});

// Bar chart of the last N samples; samples while paused are dimmed and the paused span is shaded.
function bars(samples, w, h, warn) {
  const pts = samples.slice(-N);
  const top = Math.max(50, ...pts.map((s) => s.p)) * 1.05;
  const step = w / N, off = (N - pts.length) * step;
  let out = "";
  pts.forEach((s, i) => {
    if (s.z && !(i > 0 && pts[i - 1].z)) {
      let j = i;
      while (j + 1 < pts.length && pts[j + 1].z) j++;
      out += `<rect class="band" x="${off + i * step}" y="0" width="${(j - i + 1) * step}" height="${h}"/>`;
    }
  });
  pts.forEach((s, i) => {
    const bh = Math.max(1, (s.p / top) * (h - 2));
    const cls = warn ? "b w" : s.z ? "b p" : "b";
    out += `<rect class="${cls}" x="${(off + i * step).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${Math.max(1, step - 1).toFixed(1)}" height="${bh.toFixed(1)}"/>`;
  });
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${out}</svg>`;
}

function sessionState(s) {
  if (s.verdict.warn) return "STILL BUSY";
  if (s.frozen) return "FROZEN";
  if (s.verdict.ok) return "BACKED OFF";
  return s.status === "busy" ? "BUSY" : "IDLE";
}

let snap = null;
function render() {
  const s = snap;
  if (!s) return;
  const total = s.total.slice(-N);

  $("badge").textContent = s.active ? `PAUSED · ${MODES[s.mode].toUpperCase()}` : "RUNNING";
  $("badge").className = "badge " + (s.active ? "paused" : "running");
  $("since").textContent = s.active ? (s.until ? `until ${time(s.until)}` : `since ${time(s.since)}`) : "";

  $("stateIcon").className = "icon " + (s.active ? "paused" : "running");
  $("stateIcon").innerHTML = s.active ? PAUSE_ICON : PLAY_ICON;
  $("stateTitle").textContent = s.active ? "Paused" : "Running";
  const counts = s.frozenCount ? `${s.frozenCount} frozen` : s.throttledCount ? `${s.throttledCount} throttled` : "";
  $("stateSub").textContent = s.active ? [s.reason || "manual", counts].filter(Boolean).join(" · ") : `${s.sessions.length} sessions`;
  $("resume").hidden = !s.active;
  $("pauseNow").hidden = s.active;

  $("totalNow").textContent = total.length ? pct(total[total.length - 1].p) : "–";
  $("totalAvg").textContent = total.length ? pct(total.reduce((a, x) => a + x.p, 0) / total.length) : "–";
  $("totalPeak").textContent = total.length ? pct(Math.max(...total.map((x) => x.p))) : "–";
  $("totalChart").innerHTML = bars(s.total, 148, 34, false);

  document.querySelectorAll("#modes button").forEach((b) => b.classList.toggle("on", b.dataset.click === "mode:" + s.config.mode));

  const auto = s.config.auto;
  $("autoToggle").classList.toggle("on", auto.enabled);
  if (!auto.enabled) {
    $("autoState").innerHTML = `<span style="color: var(--muted)">Off</span>`;
    $("autoSub").textContent = "Pause manually from here";
  } else if (s.reasons.length) {
    $("autoState").innerHTML = `<span style="color: var(--orange); display: flex; gap: 6px; align-items: center; min-width: 0">${VIDEO_ICON}<span class="ellipsis">${esc(s.reasons[0])}</span></span>`;
    $("autoSub").textContent = s.suppressAuto ? "Snoozed until it ends" : s.reasons.length > 1 ? `+${s.reasons.length - 1} more` : "Pausing while active";
  } else {
    $("autoState").innerHTML = `<span style="display: flex; gap: 6px; align-items: center; color: var(--muted-2)">${VIDEO_ICON}Watching</span>`;
    $("autoSub").textContent = "Calls, presentations, games";
  }

  const list = [...s.sessions].sort((a, b) => b.avg - a.avg);
  if (!list.length) {
    $("sessions").innerHTML = `<div class="empty">No agent sessions running</div>`;
  } else {
    $("sessions").innerHTML = list.map((x) => {
      const state = sessionState(x);
      const warn = x.verdict.warn;
      const top = x.top.slice(0, 2).map((p) => `${p.name} ${pct(p.pct)}`).join(" · ");
      const detail = !open.has(x.pid) ? "" : `<div class="detail">
          <div class="procs">${x.top.slice(0, 6).map((p) => `<span>${pct(p.pct)}</span><span class="ellipsis">${esc(p.name)} ${p.pid}</span>`).join("")}</div>
          ${x.verdict.text ? `<div style="font-size: 11px; color: ${warn ? "var(--orange)" : "var(--muted-2)"}">${esc(x.verdict.text)}</div>` : ""}
          <div class="row">
            <button class="btn small ${x.frozen ? "on" : ""}" data-click="freeze:${x.pid}">${x.frozen ? "Unfreeze" : "Freeze"}</button>
            <button class="btn small" data-click="reveal:${esc(x.cwd)}">Show in Finder</button>
            <span class="mono ellipsis" style="font-size: 10px; color: var(--muted); align-self: center">${esc(x.cwdShort)}</span>
          </div>
        </div>`;
      return `<div class="tr" data-pid="${x.pid}">
        <div style="min-width: 0">
          <div class="ellipsis" style="font-weight: 500">${esc(x.name)}</div>
          <div class="mono ellipsis" style="font-size: 10px; color: var(--muted)">${esc(top)}</div>
        </div>
        <span class="state" style="color: ${STATE_COLORS[state]}">${state}</span>
        ${bars(x.history, 92, 22, warn)}
        <span class="now" style="color: ${warn ? "var(--orange)" : "var(--text)"}">${pct(x.current)}</span>
        ${detail}
      </div>`;
    }).join("");
  }
  post({ action: "resize", h: Math.ceil(document.body.getBoundingClientRect().height) });
}

window.aipauseUpdate = (s) => { snap = s; render(); };
post({ action: "ready" });
</script>
</body>
</html>
